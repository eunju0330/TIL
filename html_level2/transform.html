<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform | CSS</title>
    <link rel="stylesheet" href="../css_basic/styles/reset.css">
    <style>
        .parent {
            background-color:#eee; padding:30px;
        }
        .parent .child {
            width:100px; height:100px;
            border:1px solid #000;
        }
        .parent .child1 {
            background-color:aqua;
            transition:background-color 2s;
        }
        .parent .child1:hover {
            background-color:lime;
            /* transition:애니메이션적용속성 지속시간; */
        }
        .parent .child2 {
        transition:width 0.5s, height 1s;
        }
        .parent .child2:hover {
        width:150px; height:200px;
        }
        .parent .child3 {
            transition:border 0.3s;
        }
        .parent:hover .child3 {
            border:5px solid red;
        }
        .parent .child4 {
            border-radius:50%;
            position:relative; left:0;/* 시작위치(현재위치기준) */
            transition:left 0.7s ease-out 1s;
        }
        .parent:hover .child4 {
            left:300px;
        }
        .parent .child5 {
            transition:height 1s, font-weight 0.5s;
        }
        .parent:hover .child5 {
            height:50px;
        }
        .parent:hover .child5 p {
            font-weight:800;
        }
        .parent .child6 {
            width:400px; height:600px;
            background-image:url(https://i.pinimg.com/736x/03/69/ef/0369ef9938f541e98b5f75d80001783c.jpg);
            background-size:120%;
            background-position:center;/* 초기세팅 */
            transition:background-position 0.5s, background-size 1s;
            transition:all 1s;
        }
        .parent .child6:hover {
            background-image:url(https://i.pinimg.com/736x/3a/16/ca/3a16ca93b942d333bb483339d27365de.jpg);
            /* background-position:100px 0; */
            background-size:130%;
        }
        .parent .child7 {
            width:800px; height:229px;
            background-image:url(./images/bg.jpg);
            background-position:0 0;
            background-size:cover;
            background-repeat:repeat-x;
            transition:all 10s linear;
        }
        .parent .child7:hover {
            background-position:-3000px; /* 오른쪽으로 이동하려면 -를 써야함 */
        }
    </style>
</head>
<body>
    <h1>transition</h1>
    <p>기존 CSS 속성이 사용자의 동작에 의해서 변경될 때 애니메이션 효과를 주는 속성</p>
    <div class="parent">
        <div class="child child1"></div>
        <div class="child child2"></div>
        <div class="child child3"></div>
        <div class="child child4"></div>
        <div class="child child5"><p>야호</p></div>
        <div class="child child6"></div>
        <div class="child child7"></div>
    </div>
</body>
</html>
